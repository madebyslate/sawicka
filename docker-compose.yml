services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      target: payload-runtime
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in xCloud}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in xCloud}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in xCloud}
      DEPLOY_HOOK_URL: ${DEPLOY_HOOK_URL:-}
    volumes:
      - payload-media:/app/payload/media
    networks:
      - app-network
      - postgres-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  website-build:
    profiles:
      - build
    build:
      context: .
      dockerfile: Dockerfile
      target: website-builder
    init: true
    restart: "no"
    environment:
      PAYLOAD_API_URL: http://payload:3000/api
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in xCloud}
    volumes:
      - website-dist:/output
    networks:
      - app-network
    depends_on:
      payload:
        condition: service_healthy

  router:
    image: nginx:1.28-alpine
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - website-dist:/srv/website:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy_params:/etc/nginx/proxy_params:ro
    networks:
      - app-network
    depends_on:
      payload:
        condition: service_healthy

volumes:
  payload-media:
    name: ${PAYLOAD_MEDIA_VOLUME:-sawicka-payload-media}
  website-dist:

networks:
  app-network:
    driver: bridge
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK:-phobos-internal}
